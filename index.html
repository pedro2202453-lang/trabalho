<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEG Soft-Starter | Painel Tecnológico Interativo</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141b2d;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --text-color: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--neon-blue);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .system-status {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: rgba(57, 255, 20, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        /* Elementos Interativos de Estado */
        .timeline-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .state-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-color);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }

        .state-btn:hover {
            border-color: var(--neon-blue);
            background: #243249;
        }

        .state-btn.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .state-btn h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
            color: #fff;
        }

        .state-btn p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Mostrador Dinâmico */
        .display-monitor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .telemetry-box {
            background: #0f1422;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #1e293b;
            text-align: center;
        }

        .telemetry-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .telemetry-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--neon-blue);
            margin-top: 0.25rem;
            font-family: monospace;
            transition: color 0.3s ease;
        }

        /* Sliders de Parâmetros */
        .parameter-group {
            margin-bottom: 1.25rem;
        }

        .parameter-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .parameter-group span {
            font-family: monospace;
            color: var(--neon-blue);
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #1e293b;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-blue);
        }
    </style>
</head>
<body>

    <header>
        <h1>SISTEMA DE SIMULAÇÃO WEG SSW</h1>
        <p>Apresentação Técnica Interativa Indústria 4.0</p>
    </header>

    <div class="dashboard">
        <!-- LADO ESQUERDO: SELEÇÃO DE ESTADO -->
        <div class="card">
            <h2>PROCESSO DE PARTIDA <span class="system-status" id="sys-status">AGUARDANDO</span></h2>
            <div class="timeline-buttons">
                <button class="state-btn active" onclick="changeState('ready', 0, 0, 'AGUARDANDO', 'var(--neon-blue)')">
                    <h3>01. Estado de Repouso</h3>
                    <p>Motor parado. Sistema monitorando as fases elétricas de entrada prontificadas.</p>
                </button>
                <button class="state-btn" onclick="changeState('ramp-up', 45, 300, 'RAMPA ACEL.', 'orange')">
                    <h3>02. Rampa de Aceleração (0s - 10s)</h3>
                    <p>Disparo controlado dos tiristores. Tensão cresce e corrente fica limitada em patamar seguro.</p>
                </button>
                <button class="state-btn" onclick="changeState('bypass', 100, 100, 'BYPASS ATIVO', 'var(--neon-green)')">
                    <h3>03. Regime Pleno / Bypass (10s - 20s)</h3>
                    <p>Contato mecânico fecha internamente. O motor recebe energia limpa e os tiristores descansam.</p>
                </button>
                <button class="state-btn" onclick="changeState('ramp-down', 60, 85, 'RAMPA DESACEL.', 'var(--neon-red)')">
                    <h3>04. Desaceleração Suave (20s - 30s)</h3>
                    <p>Tensão é reduzida linearmente. Ideal para evitar o Golpe de Aríete em sistemas hidráulicos.</p>
                </button>
            </div>
        </div>

        <!-- LADO DIREITO: TELEMETRIA E AJUSTES -->
        <div class="card">
            <h2>TELEMETRIA EM TEMPO REAL</h2>
            <div class="display-monitor">
                <div class="telemetry-box">
                    <div class="telemetry-label">Tensão Eficaz</div>
                    <div class="telemetry-value" id="val-tensaopo">0%</div>
                </div>
                <div class="telemetry-box">
                    <div class="telemetry-label">Corrente de Pico</div>
                    <div class="telemetry-value" id="val-corrente">0%</div>
                </div>
            </div>

            <h2>PARÂMETROS DE ENGENHARIA (CONFIGURAÇÃO)</h2>
            <div class="parameter-group">
                <label>Tensão Inicial (V-Start): <span id="lbl-vstart">30%</span></label>
                <input type="range" min="10" max="70" value="30" class="slider" id="sld-vstart" oninput="updateParam('vstart')">
            </div>
            <div class="parameter-group">
                <label>Limitação de Corrente: <span id="lbl-ilimit">300%</span></label>
                <input type="range" min="150" max="500" value="300" class="slider" id="sld-ilimit" oninput="updateParam('ilimit')">
            </div>
            <div class="parameter-group">
                <label>Tempo de Rampa: <span id="lbl-time">10s</span></label>
                <input type="range" min="5" max="30" value="10" class="slider" id="sld-time" oninput="updateParam('time')">
            </div>
        </div>
    </div>

    <script>
        function changeState(state, tensao, corrente, statusTxt, statusColor) {
            document.querySelectorAll('.state-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            document.getElementById('val-tensaopo').innerText = tensao + '%';
            document.getElementById('val-corrente').innerText = corrente + '%';
            
            const statusLabel = document.getElementById('sys-status');
            statusLabel.innerText = statusTxt;
            statusLabel.style.color = statusColor;
            statusLabel.style.borderColor = statusColor;
            statusLabel.style.backgroundColor = statusColor + '1a';
        }

        function updateParam(param) {
            if(param === 'vstart') {
                const val = document.getElementById('sld-vstart').value;
                document.getElementById('lbl-vstart').innerText = val + '%';
            } else if(param === 'ilimit') {
                const val = document.getElementById('sld-ilimit').value;
                document.getElementById('lbl-ilimit').innerText = val + '%';
            } else if(param === 'time') {
                const val = document.getElementById('sld-time').value;
                document.getElementById('lbl-time').innerText = val + 's';
            }
        }
    </script>
</body>
</html>
